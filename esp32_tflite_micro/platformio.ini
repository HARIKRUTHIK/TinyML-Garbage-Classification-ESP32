; ==============================================================================
; PlatformIO Configuration for ESP32 TinyML Waste Classifier
; ==============================================================================

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

lib_deps =
    tanakamasayuki/TensorFlowLite_ESP32 @ ^0.9.0

build_flags =
    -D CORE_DEBUG_LEVEL=2
    -O3
